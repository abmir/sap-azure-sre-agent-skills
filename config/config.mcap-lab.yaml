# SAP Azure SRE Agent — MCAP Lab Environment Configuration
# 
# This is a SAMPLE configuration file for the MCAP lab environment.
# Use this as a reference when filling out config.template.yaml for your environment.
#
# ⚠️ DO NOT commit API keys or secrets to public repositories.
# In production, store secrets in Azure Key Vault and reference them.

# ============================================
# Environment Identity
# ============================================
environment_name: "MCAP-Lab"
subscription_id: "40050ff9-81f0-4654-9bd4-34551fe455df"
tenant_id: "1f92707b-cdc6-4a6e-b45d-4c5f40a5be7c"

# ============================================
# Azure Monitor for SAP (AMS)
# ============================================
ams:
  workspace_id: "d337a40e-3213-4e5a-a0e8-c560d537c085"
  resource_group: "mrg-sapmon-abb"

# ============================================
# SRE Operations Proxy Functions
# ============================================
proxy:
  config:
    url: "https://sap-config-proxy.azurewebsites.net/api"
    api_key: "<stored-in-keyvault>"     # Actual key: reference KV secret
    storage_account: "stsreconfigscus"
    container: "sap-configs"
  command:
    url: "https://sap-command-proxy.azurewebsites.net/api"
    api_key: "<stored-in-keyvault>"     # Actual key: reference KV secret

# ============================================
# SAP Landscape
# ============================================
# Full details are in sap-landscape-inventory.json (uploaded to Knowledge Base).
# This section provides a quick reference for the onboarding instructions.
landscape:
  systems:
    - sid: AB1
      db_sid: DB1
      type: single-host
      resource_group: RG_SAP_CUS_AB1
      managed_resource_group: mrg-AB1-48f3f2
      vms:
        - name: AB1vm
          roles: [db, ascs, app]
          hana_instance: "00"
          ascs_instance: "01"
          app_instance: "02"

    - sid: AB2
      db_sid: AB2
      type: distributed
      resource_group: RG_SAP_AB2
      managed_resource_group: mrg-AB2-07d671
      vms:
        - name: ab2dbvm
          roles: [db]
          hana_instance: "00"
        - name: ab2ascsvm
          roles: [ascs]
          ascs_instance: "00"
        - name: ab2appvm0
          roles: [app]
          app_instance: "00"

    - sid: AB3
      db_sid: AB3
      type: distributed
      resource_group: RG_SAP_AB3
      managed_resource_group: mrg-AB3-f53640
      vms:
        - name: ab3dbvm
          roles: [db]
          hana_instance: "00"
        - name: ab3ascsvm
          roles: [ascs]
          ascs_instance: "00"
        - name: ab3appvm0
          roles: [app]
          app_instance: "00"

    - sid: HSO
      db_sid: HSO
      type: scaleout-ha
      resource_group: RG_SAP_CUS
      vms:
        - name: vm01
          roles: [db]
          hana_instance: "00"
        - name: vm02
          roles: [db]
          hana_instance: "00"
        - name: vm03
          roles: [db]
          hana_instance: "00"
        - name: vm04
          roles: [db]
          hana_instance: "00"
        - name: vm05
          roles: [db]
          hana_instance: "00"
        - name: sbdvm01
          roles: [sbd]
        - name: sbdvm02
          roles: [sbd]
        - name: sbdvm03
          roles: [sbd]

# ============================================
# Operational Settings
# ============================================
operations:
  auto_shutdown_utc: "06:52"            # MCAPSGov-AutomationApp shuts down all VMs daily
  alert_suppression_during_shutdown: true
  # Note: AB1 is the most reliable test target (stable, all-in-one)

# ============================================
# External Integrations (Optional)
# ============================================
integrations:
  servicenow:
    url: ""                             # Not configured in MCAP lab
  apm:
    type: ""                            # Not configured in MCAP lab
    url: ""

# ============================================
# Agent Resource Group
# ============================================
agent:
  resource_group: "RG_SAP_SRE_Agent"
  managed_identity_name: "sap-sre-agent-gbfldtblf3bp2"

# ============================================
# SRE Operations Resource Group
# ============================================
sre_ops:
  resource_group: "RG_SRE_OPS"
  managed_identity_name: "sre-ops-umi"
